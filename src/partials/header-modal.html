<div class="modal">
  <div class="modal__backdrop"></div>

  <div class="modal__body">
    <button class="modal__close" type="button" aria-label="Закрити">✕</button>

    <h2 class="modal__title">Вхід до акаунта</h2>
    <p class="modal__text">Увійди, щоб бачити збережені AI-сервіси.</p>

    <form class="modal__form">
      <label class="modal__label">
        Email
        <input
          class="modal__input"
          type="email"
          name="email"
          placeholder="name@gmail.com"
          autocomplete="email"
          required
        />
      </label>

      <label class="modal__label">
        Пароль
        <input
          class="modal__input"
          type="password"
          name="password"
          placeholder="Ваш пароль"
          autocomplete="current-password"
          required
        />
      </label>

      <button class="modal__submit" type="submit">Увійти</button>
    </form>
  </div>
</div>
